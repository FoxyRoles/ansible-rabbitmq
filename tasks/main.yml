---

- name: Remove legacy Erlang and RabbitMQ repository files
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}.list"
    state: absent
  loop:
    - erlang
    - rabbitmq
  register: rabbitmq_legacy_repositories

- name: Install RabbitMQ repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    cache_valid_time: 3600

- name: Download the Team RabbitMQ APT signing key
  ansible.builtin.get_url:
    url: https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA
    dest: /usr/share/keyrings/rabbitmq-team.asc
    mode: '0644'
  register: rabbitmq_repository_key

- name: Configure the Erlang and RabbitMQ APT repositories
  ansible.builtin.deb822_repository:
    name: "{{ item }}"
    uris:
      - "https://deb1.rabbitmq.com/{{ item }}/ubuntu/{{ rabbitmq_apt_suite }}"
      - "https://deb2.rabbitmq.com/{{ item }}/ubuntu/{{ rabbitmq_apt_suite }}"
    suites: "{{ rabbitmq_apt_suite }}"
    components: main
    signed_by: /usr/share/keyrings/rabbitmq-team.asc
    state: present
  loop:
    - rabbitmq-erlang
    - rabbitmq-server
  vars:
    # Team RabbitMQ uses the Ubuntu 24.04 repository for Ubuntu 26.04.
    rabbitmq_apt_suite: "{{ 'noble' if ansible_facts['distribution_release'] == 'resolute' else ansible_facts['distribution_release'] }}"
  register: rabbitmq_repositories

- name: Refresh the APT cache after RabbitMQ repository changes
  ansible.builtin.apt:
    update_cache: true
  when: rabbitmq_legacy_repositories is changed or rabbitmq_repository_key is changed or rabbitmq_repositories is changed

- name: RabbitMQ is present
  apt: name=rabbitmq-server state=present

- name: RabbitMQ is running
  service: name=rabbitmq-server state=started enabled=yes

- name: RabbitMQ management plugin is installed
  rabbitmq_plugin: name=rabbitmq_management state=enabled
  notify:
    - restart rabbitmq

- name: RabbitMQ root user present
  rabbitmq_user:
    user: root
    password: "{{ rabbitmq_root_password }}"
    tags: administrator
    vhost: /
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    state: present

- name: RabbitMQ guest user absent
  rabbitmq_user:
    user: guest
    state: absent
